<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Paco's Applied ML Lab</title>
  <desc id="desc">A dark terminal-inspired banner for an applied machine learning portfolio.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#233047" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#142233"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="44" y="38" width="1112" height="244" rx="12" fill="#0d1117" stroke="#314158" stroke-width="2"/>
  <circle cx="74" cy="68" r="7" fill="#ff6b5f"/>
  <circle cx="98" cy="68" r="7" fill="#f5c451"/>
  <circle cx="122" cy="68" r="7" fill="#35d0ba"/>
  <text x="150" y="74" fill="#8290a8" font-family="monospace" font-size="16">paco@applied-ml-lab</text>
  <text x="86" y="142" fill="#35d0ba" font-family="monospace" font-size="24">$ whoami</text>
  <text x="86" y="188" fill="#f4f7fb" font-family="monospace" font-size="38" font-weight="700">gokul-debugger</text>
  <text x="86" y="226" fill="#a9b7ca" font-family="monospace" font-size="18">data • models • experiments • useful demos</text>
  <rect x="86" y="252" width="13" height="22" fill="#f5c451">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="111" y="270" fill="#35d0ba" font-family="monospace" font-size="17">building in public</text>
</svg>
